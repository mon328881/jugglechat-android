plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.juggle.im.app.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.juggle.im.android"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        namespace "com.juggle.im.android"
        manifestPlaceholders = [
                JPUSH_PKGNAME: "com.juggle.im.android",
                JPUSH_APPKEY : "d381f2fe7e594b7f28d42986",
                JPUSH_CHANNEL: "developer-default"
        ]
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            storeFile file("../keystore/key.keystore")
            storePassword "juggleim"
            keyAlias "juggleim"
            keyPassword "juggleim"
        }

        debug {
            storeFile file("../keystore/key.keystore")
            storePassword "juggleim"
            keyAlias "juggleim"
            keyPassword "juggleim"
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.androidx.swiperefreshlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation "androidx.multidex:multidex:2.0.1"

    implementation libs.androidx.appcompat.v142
    implementation libs.google.material.v161
    implementation libs.androidx.constraintlayout
    implementation 'androidx.recyclerview:recyclerview:1.3.0'

    // 生命周期组件
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.1'
    implementation("org.greenrobot:eventbus:3.3.1")

    // 依赖注入
    implementation libs.dagger.hilt.android
    annotationProcessor libs.dagger.hilt.compiler

    // 图片加载
    implementation libs.github.glide
    annotationProcessor libs.glide.compiler

    // pinch-to-zoom image view for preview (fallback alternative)
    // pinch-to-zoom image view for preview
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'

    // 网络
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    implementation "com.google.zxing:core:3.3.2"


    // juggleim
    implementation 'com.juggle.im:juggle:1.8.27.1'
    implementation 'org.java-websocket:Java-WebSocket:1.5.5'
    implementation 'com.google.protobuf:protobuf-javalite:3.18.0'
    implementation 'com.qiniu:qiniu-android-sdk:8.7.0'

    // 音视频
    implementation 'com.juggle.call.zego:juggle:1.8.25'
    implementation 'im.zego:express-video:3.17.3'

    // 腾讯地图
    // 腾讯地图 Android 向量 SDK（版本号可按官网更新）
    implementation 'com.tencent.map:tencent-map-vector-sdk:5.7.0'

