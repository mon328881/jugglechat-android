// 从 local.properties 读取配置，未配置时使用默认值（勿将敏感信息提交到仓库）
def getLocalProp = { String key, String fallback ->
    def props = new Properties()
    def f = rootProject.file("local.properties")
    if (f.exists()) f.withInputStream { props.load(it) }
    return props.getProperty(key, fallback)
}

android {
    namespace 'com.juggle.im.app.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.juggle.im.android"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "2.1.0"
        multiDexEnabled true
        namespace "com.juggle.im.android"
        manifestPlaceholders = [
                JPUSH_PKGNAME: "com.juggle.im.android",
                JPUSH_APPKEY : getLocalProp("JPUSH_APPKEY", "d381f2fe7e594b7f28d42986"),
                JPUSH_CHANNEL: "developer-default"
        ]
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "APP_KEY", "\"${getLocalProp('APP_KEY', 'JJJB0Dh1PtDgZx5X')}\""
        buildConfigField "String", "APP_SERVER_URL", "\"${getLocalProp('APP_SERVER_URL', 'http://192.168.123.214:8070')}\""
        buildConfigField "String", "IM_SERVER", "\"${getLocalProp('IM_SERVER', 'ws://192.168.123.214:9003')}\""
        buildConfigField "int", "ZEGO_ID", getLocalProp("ZEGO_ID", "1881186044")
        buildConfigField "String", "APP_DOWNLOAD_PAGE_URL", "\"${getLocalProp('APP_DOWNLOAD_PAGE_URL', 'https://im-anhui.onego.top/')}\""
    }
    signingConfigs {
        release {
            storeFile file("../keystore/key.keystore")
            storePassword getLocalProp("KEYSTORE_PASSWORD", "juggleim")
            keyAlias getLocalProp("KEY_ALIAS", "juggleim")
            keyPassword getLocalProp("KEY_PASSWORD", "juggleim")
        }

        debug {
            storeFile file("../keystore/key.keystore")
            storePassword getLocalProp("KEYSTORE_PASSWORD", "juggleim")
            keyAlias getLocalProp("KEY_ALIAS", "juggleim")
            keyPassword getLocalProp("KEY_PASSWORD", "juggleim")
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    buildFeatures {
        buildConfig = true
    }
}

